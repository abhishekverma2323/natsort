name: Rust CI

on:
  push:
    branches:
      - python-to-rust-port
  pull_request:
    paths:
      - "rust-port/**"
      - "parity/**"
      - "fuzz/**"
      - "bench/**"
      - "audit/**"
      - "natsort/**"
      - "tests/**"
      - "Makefile"
      - "Dockerfile"
      - ".dockerignore"
      - ".port-mortem.toml"
      - "pyproject.toml"
      - ".github/workflows/rust-ci.yml"
      - ".gitattributes"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-port

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust with required components
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Enforce first-party unsafe boundary
        shell: bash
        run: bash ./scripts/check_unsafe.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release CLI
        run: cargo build --release --bin natsort

      - name: Build release benchmark
        run: cargo build --release --bin benchmark

      - name: CLI smoke test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          actual="$(./target/release/natsort file10 file2 file1)"
          expected=$'file1\nfile2\nfile10'
          test "$actual" = "$expected"

      - name: CLI smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & .\target\release\natsort.exe file10 file2 file1
          $expected = @("file1", "file2", "file10")

          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            Write-Error "Unexpected CLI output: $($actual -join ', ')"
            exit 1
          }

  differential-fuzz:
    name: Deterministic differential fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python reference package
        run: python -m pip install .

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Run deterministic differential fuzzing
        run: |
          python parity/differential_fuzz.py \
            --cases 200 \
            --seed 20260801 \
            --python-oracle python

      - name: Upload differential failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-fuzz-failure
          path: parity/differential_fuzz_failure.json
          if-no-files-found: ignore
          retention-days: 14

  submission-gates:
    name: Judge-facing submission gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal \
            --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Run submission checks
        run: make submission-check

      - name: Print committed evidence summary
        run: make evidence-summary
